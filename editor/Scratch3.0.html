<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" value="notranslate" />
  <link rel="shortcut icon" href="./static/favicon.ico" />
  <link rel="stylesheet" href="./css/scratch.css" />
  <title>在线图形化编程</title>
  
  <style>
    /* 彻底隐藏底部书包栏与多余按钮，确保纯净做题体验 */
    [class*="backpack_backpack-container"],
    .backpack_backpack-container_2YvyL,
    [class*="menu-bar_custom-button"],
    [class*="menu-bar_mystuff-container"],
    [class*="menu-bar_user-avatar-container"],
    [class*="menu-bar_account-info-group"] {
      display: none !important;
    }
  </style>

  <script>
    document.cookie = "scratchlanguage=zh-cn";

    window.scratchConfig = {
      session: {
        token: "",
        username: "同学"
      },
      // 1. 彻底禁用底部书包
      backpack: {
        enable: false,
        api: ""
      },
      // 2. 云变量
      cloudData: {
        enable: false
      },
      projectInfo: {
        projectName: "Scratch作答项目",
        authorUsername: "同学"
      },
      logo: {
        show: true
      },
      stageArea: {
        fullscreenButton: { show: true },
        startButton: { show: true },
        stopButton: { show: true }
      },
      menuBar: {
        style: {
          background: 'hsla(215, 100%, 65%, 1)'
        },
        languageButton: {
          show: false,
          defaultLanguage: 'zh-cn'
        },
        newButton: { show: true },
        loadFileButton: { show: true },
        saveFileButton: { show: true },
        turboModeButton: { show: true },
        helpButton: { show: false },
        // 3. 彻底禁用右上角多余物品与名库头像
        myStuff: { show: false },
        userAvatar: { show: false },
        // 4. 彻底清空顶部自定义提交/保存按钮
        customButtons: []
      },
      blocks: {
        scale: 0.8
      },
      // 5. 关联完整本地素材库 (330+角色、造型、背景、声音)，100% 本地高速直读，零外网依赖
      assets: {
        assetHost: './static',
        defaultIndex: {
          sprites: "./static/json_index/sprites.json",
          costumes: "./static/json_index/costumes.json",
          backdrops: "./static/json_index/backdrops.json",
          sounds: "./static/json_index/sounds.json"
        }
      },
      defaultProjectURL: "./static/project.sb3",
      handleVmInitialized: function (vm) {
        window.vm = vm;
        window.parent.postMessage({ type: 'scratch_vm_ready' }, '*');
      }
    };

    // 6. 监听与父答题系统的 postMessage 双向通信
    window.addEventListener('message', async function (event) {
      var msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      // 加载题目工程文件
      if (msg.type === 'scratch_load') {
        try {
          var arrayBuffer;
          if (msg.projectData) {
            arrayBuffer = msg.projectData;
          } else if (msg.fileUrl) {
            var response = await fetch(msg.fileUrl);
            if (!response.ok) throw new Error('网络请求错误 ' + response.status);
            arrayBuffer = await response.arrayBuffer();
          } else {
            throw new Error('未提供项目数据');
          }

          var checkTimer = setInterval(function () {
            var vm = (window.scratch && window.scratch.vm) || window.vm;
            if (vm) {
              clearInterval(checkTimer);
              vm.loadProject(arrayBuffer)
                .then(function () {
                  window.parent.postMessage({ type: 'scratch_load_success' }, '*');
                })
                .catch(function (err) {
                  window.parent.postMessage({ type: 'scratch_error', message: '加载项目失败: ' + err.message }, '*');
                });
            }
          }, 100);
        } catch (err) {
          window.parent.postMessage({ type: 'scratch_error', message: '下载作品项目失败: ' + err.message }, '*');
        }
      }

      // 保存学生作品为 .sb3
      if (msg.type === 'scratch_save') {
        var qId = msg.qId;
        var vm = (window.scratch && window.scratch.vm) || window.vm;
        if (!vm) {
          window.parent.postMessage({ type: 'scratch_error', message: 'Scratch 虚拟机尚未初始化完成' }, '*');
          return;
        }
        try {
          vm.saveProjectSb3()
            .then(function (blob) {
              window.parent.postMessage({ type: 'scratch_saved', qId: qId, blob: blob }, '*');
            })
            .catch(function (err) {
              window.parent.postMessage({ type: 'scratch_error', message: '生成 sb3 数据失败: ' + err.message }, '*');
            });
        } catch (err) {
          window.parent.postMessage({ type: 'scratch_error', message: '保存动作执行失败: ' + err.message }, '*');
        }
      }
    });

    // 持续检测主动握手通知
    var checkReadyTimer = setInterval(function () {
      var vm = (window.scratch && window.scratch.vm) || window.vm;
      if (vm) {
        clearInterval(checkReadyTimer);
        window.parent.postMessage({ type: 'scratch_vm_ready' }, '*');
      }
    }, 150);
  </script>
</head>

<body>
  <div id="scratch">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4F46E5;font-family:sans-serif;">
      <div style="text-align:center;">
        <div style="font-size:32px;margin-bottom:12px;">🐱</div>
        <div style="font-size:14px;font-weight:bold;">正在加载 Scratch 在线编程环境...</div>
      </div>
    </div>
  </div>

  <!-- 轻量化精简核心库 -->
  <script src="./js/lib.min.js"></script>
  <script src="./chunks/gui.js"></script>
</body>
</html>
