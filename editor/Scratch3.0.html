正在加载，请稍候。<p>
等程序加载完毕后，若将Scratch项目文件拖曳到本窗口，可直接打开该文件。

        <div id="container" style="position:absolute;visibility:hidden;z-index:99999;"><div class=box>您可通过拖曳Scratch项目文件到此处来实现文件的打开操作。</div></div>
        <div id="app"></div>


<script>
    /*拖拽的目标对象------ document 监听drop 并防止浏览器打开客户端的图片*/
    document.ondragover = function (e) {
        e.preventDefault();  //只有在ondragover中阻止默认行为才能触发 ondrop 而不是 ondragleave
        document.getElementById("container").style.visibility="visible";
    };

    document.ondrop = function (e) {
        e.preventDefault();  //阻止 document.ondrop的默认行为  *** 在新窗口中打开拖进的图片
        document.getElementById("container").style.visibility="hidden";

    };
    /*拖拽的源对象----- 客户端的一张图片 */
    /*拖拽目标对象-----div#container  若图片释放在此元素上方，则需要在其中显示*/
    container.ondragover = function (e) {
        e.preventDefault();
        document.getElementById("container").style.visibility="hidden";
    };

    container.ondragleave = function (e) {
        e.preventDefault();
        document.getElementById("container").style.visibility="hidden";
    };

    container.ondrop = function (e) {
        var list = e.dataTransfer.files;
        for (var i = 0; i < list.length; i++) {
            var f = list[i];
            reader(f);
        }
    };

    function reader(f) {
        var reader = new FileReader();
        reader.readAsArrayBuffer(f);//readAsDataURL(f);
        reader.onload = function () {
           oGUI.props.vm.loadProject(reader.result);
           document.getElementById("container").style.visibility="hidden";
        }
    } 

</script>

        <!-- Vendor & Initialize (Session & Localization)-->
        <script src="./js/common.bundle.js"></script>

        <!-- Scripts -->
        <script src="./js/projects.intl.js"></script>
        <script src="./js/projects.bundle.js"></script>

        <!-- Translate title element -->
        
        <script>
            // 跨域 postMessage 通信协议支持
            window.addEventListener('message', async function (event) {
                var msg = event.data;
                if (!msg || typeof msg !== 'object') return;

                // 1. 加载项目逻辑
                if (msg.type === 'scratch_load') {
                    var fileUrl = msg.fileUrl;
                    try {
                        var response = await fetch(fileUrl);
                        if (!response.ok) throw new Error('网络请求错误 ' + response.status);
                        var arrayBuffer = await response.arrayBuffer();

                        // 循环轮询直至 VM 初始化完成
                        var checkCount = 0;
                        var checkTimer = setInterval(function () {
                            var vm = (oGUI && oGUI.props && oGUI.props.vm) || oVM;
                            if (vm) {
                                clearInterval(checkTimer);
                                vm.loadProject(arrayBuffer)
                                    .then(function () {
                                        window.parent.postMessage({ type: 'scratch_load_success' }, '*');
                                    })
                                    .catch(function (err) {
                                        window.parent.postMessage({ type: 'scratch_error', message: '加载项目失败: ' + err.message }, '*');
                                    });
                            }
                            checkCount++;
                            if (checkCount > 100) { // 延长等待至20秒
                                clearInterval(checkTimer);
                                window.parent.postMessage({ type: 'scratch_error', message: '等待 Scratch 虚拟机初始化超时' }, '*');
                            }
                        }, 200);
                    } catch (err) {
                        window.parent.postMessage({ type: 'scratch_error', message: '下载作品项目失败: ' + err.message }, '*');
                    }
                }

                // 2. 保存项目逻辑
                if (msg.type === 'scratch_save') {
                    var qId = msg.qId;
                    var vm = (oGUI && oGUI.props && oGUI.props.vm) || oVM;
                    if (!vm) {
                        window.parent.postMessage({ type: 'scratch_error', message: 'Scratch 虚拟机尚未初始化完成，请稍候再试' }, '*');
                        return;
                    }
                    try {
                        vm.saveProjectSb3().then(function (blob) {
                            window.parent.postMessage({ type: 'scratch_saved', qId: qId, blob: blob }, '*');
                        }).catch(function (err) {
                            window.parent.postMessage({ type: 'scratch_error', message: '生成 sb3 数据失败: ' + err.message }, '*');
                        });
                    } catch (err) {
                        window.parent.postMessage({ type: 'scratch_error', message: '保存动作执行失败: ' + err.message }, '*');
                    }
                }
            });
        </script>
